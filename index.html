<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Site</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="container">
    <div class="top">
      <div>
        <h1 id="name">Arham Mir</h1>
        <p class="headline" id="headline"></p>
        <p class="meta">
          <span id="location"></span> · <a id="emailLink" href="#">Email</a>
        </p>
      </div>
      <nav class="links" id="links"></nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>About</h2>
      <div id="about"></div>
    </section>

    <section class="card">
      <h2>Skills</h2>
      <div class="tags" id="skills"></div>
    </section>

    <section class="card">
      <h2>Experience</h2>
      <div id="experience"></div>
    </section>

    <section class="card">
      <h2>Projects</h2>
      <div id="projects"></div>
    </section>

    <section class="card">
      <h2>Education</h2>
      <div id="education"></div>
    </section>

    <footer class="footer">
      <p>© <span id="year"></span> <span id="footerName"></span></p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
